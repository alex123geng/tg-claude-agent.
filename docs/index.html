<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Юнит-экономика WB — Скаут</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%235b9dff'/%3E%3Ctext x='50' y='68' font-size='58' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%230f1216'%3E%D0%A1%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<!-- cdnjs' xlsx mirror is pinned at 0.18.5, which carries known advisories
     (GHSA-4r6h-8v6p-xvw6 prototype pollution, GHSA-5pgg-2g8v-p4x9 ReDoS) — both only
     reachable by parsing a maliciously crafted spreadsheet. Accepted here: this page has
     no backend, and the only files it ever parses are the seller's own WB report
     downloads, not third-party input. See README "Известные ограничения" before raising
     the version — SheetJS no longer publishes newer builds to cdnjs, only from
     cdn.sheetjs.com, which this sandbox's network policy couldn't reach to verify. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Скаут</span>
      <span class="brand-sub">Юнит-экономика WB</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="overview">Обзор</button>
      <button class="tab-btn" data-tab="unit">Юнит-экономика</button>
      <button class="tab-btn" data-tab="cost">Себестоимость</button>
      <button class="tab-btn" data-tab="uploads">Загрузки</button>
      <button class="tab-btn" data-tab="settings">Настройки</button>
    </nav>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main id="content"></main>

  <input type="file" id="fileInputWeekly" accept=".xlsx,.zip" multiple hidden />
  <input type="file" id="fileInputCostRef" accept=".xlsx,.html,.htm" hidden />
  <input type="file" id="fileInputImport" accept=".json" hidden />

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
